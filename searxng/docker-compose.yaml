services:
  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - external_ns_network_base
    volumes:
      - searxng_redis_data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      external_ns_network_base:
      external_ns_network_cloudflare:
        ipv4_address: ${SEARXNG_IP}
    ports:
      - ${SEARXNG_EXTERNAL_PORT}:${SEARXNG_INTERNAL_PORT}
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-8}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-8}
      - SEARXNG_HOSTNAME=${SEARXNG_HOSTNAME}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  searxng_redis_data:

networks:
  external_ns_network_base:
    external: true
  external_ns_network_cloudflare:
    external: true

