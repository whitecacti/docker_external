services:
  minio:
    container_name: minio
    # image: bitnami/minio:latest
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      # - "9001:9001" # not using the UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER_ENV}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD_ENV}
    command: server /data --console-address ":9001"
    volumes:
        - minio_data:/data

volumes:
  minio_data: