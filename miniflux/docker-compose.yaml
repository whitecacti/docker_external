services:
  miniflux:
    image: miniflux/miniflux:latest
    ports:
      - "${MINIFLUX_EXTERNAL_PORT}:${MINIFLUX_INTERNAL_PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://miniflux:${MINIFLUX_POSTGRES_PASSWORD}@db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${MINIFLUX_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASSWORD}
    networks:
      external_ns_network_base:
      external_ns_network_cloudflare:
        ipv4_address: ${MINIFLUX_IP}
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=miniflux
      - POSTGRES_PASSWORD=${MINIFLUX_POSTGRES_PASSWORD}
      - POSTGRES_DB=miniflux
    volumes:
      - miniflux-db-external:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
    networks:
      external_ns_network_base:

volumes:
  miniflux-db-external:

networks:
  external_ns_network_base:
    external: true
  external_ns_network_cloudflare:
    external: true

