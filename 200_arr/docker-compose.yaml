services:
  # Linux ISO Downloader
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=America/Los_Angeles
      # - DELUGE_LOGLEVEL=debug #optional
    volumes:
      - ${DELUGE_NAS}/config:/config
      - ${DELUGE_NAS_MEDIA}/movies:/tnas_movies
      - ${DELUGE_NAS_MEDIA}/tv_shows:/tnas_tv_shows
      - ${DELUGE_NAS_MEDIA}/music:/tnas_music
      - ${DELUGE_NAS_MEDIA}/iso:/tnas_iso
      - ${DELUGE_NAS_MEDIA}/audiobooks:/tnas_audiobooks
      - ${DELUGE_NAS_MEDIA}/books:/tnas_books
      - ${DELUGE_NAS_MEDIA}/torrents:/tnas_torrents
    ports:
      - ${DELUGE_PORTS}
      - 6881:6881
      - 6881:6881/udp
      - 58846:58846 #optional
    restart: unless-stopped

  # Trackers & Indexers
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=America/Los_Angeles
    volumes:
      - ${PROWLARR_NAS}/config:/config
    ports:
      - ${PROWLARR_PORTS}
    restart: unless-stopped

  # TV Shows
  # interesting read - https://trash-guides.info/Sonarr/
  # https://github.com/Rick45/quick-arr-Stack?tab=readme-ov-file#setup-sonarr
  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=America/Los_Angeles
    ports:
      - ${SONARR_PORTS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SONARR_NAS}/config:/config
      - ${SONARR_NAS_TV}:/tnas_tv_shows
      #also need the location where radarr is going to place the complete.incomplete files, same as deluge has access to.
      - ${SONARR_NAS_TORRENTS}:/tnas_torrents 
    restart: unless-stopped

  # Movies
  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${COMMON_PUID}
      - PGID=${COMMON_PGID}
      - TZ=America/Los_Angeles
    ports: 
      - ${RADARR_PORTS}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${RADARR_NAS}/config:/config
      - ${RADARR_NAS_MOVIES}:/tnas_movies
      # Need the location where radarr is going to place the complete/incomplete files, same as what deluge has access to.
      - ${RADARR_NAS_TORRENTS}:/tnas_torrents 
    restart: unless-stopped

  # Connecting flaresolver to prowlarr
  # https://trash-guides.info/Prowlarr/prowlarr-setup-flaresolverr/

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Europe/London
    ports:
      - ${FLARESOLVERR_PORTS}
    volumes:
      - ${FLARESOLVERR_NAS}/config:/config
    restart: unless-stopped