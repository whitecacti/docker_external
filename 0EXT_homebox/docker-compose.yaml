services:
  homebox:
    image: ghcr.io/hay-kot/homebox:latest-rootless
    container_name: homebox
    restart: unless-stopped
    environment:
    - HBOX_LOG_LEVEL=info
    - HBOX_LOG_FORMAT=text
    - HBOX_WEB_MAX_UPLOAD_SIZE=20
    - HBOX_OPTIONS_ALLOW_REGISTRATION=false
    volumes:
      - ./data:/data/
    ports:
      - ${PORTS_CONFIG}
    networks:
      - ens_bridge

networks:
  ens_bridge:
    external: true